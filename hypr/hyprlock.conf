source = ~/.cache/wal/colors-hyprland

general {
    disable_loading_bar =       false
    hide_cursor =               false
    grace =                     0
    no_fade_in =                false           
    no_fade_out =               false          
    # pam:enabled =             true # Habilita la autenticación PAM (generalmente déjalo en true)
    # pam:module =              hyprlock # Módulo PAM a usar (por defecto es hyprlock)
    # fingerprint:enabled =     false # Habilita la autenticación por huella dactilar (requiere fprintd)
    # ignore_empty_input =      false # Omite la validación si no se proporciona contraseña
}

background {
    monitor =
    path =                      screenshot
    # color =                     rgba(17, 17, 17, 1.0)
    blur_passes =               5 # Número de pasadas de desenfoque (0 para deshabilitar el desenfoque)
    # blur_size = 7             # Tamaño del desenfoque
    blur_size =                 2
    noise =                     0.0117 # Nivel de ruido del desenfoque
    contrast =                  0.8916 # Contraste del fondo
    brightness =                0.6
    # vibrancy =                  0.1696
    # vibrancy_darkness =         0.05
    # reload_time =               -1
    # reload_cmd =                [[Empty]]
    # crossfade_time =            -1.0
    # zindex =                    -1
}

input-field {
    monitor =
    size =                      240, 36
    outline_thickness =         1
    dots_size =                 0.10
    dots_spacing =              0.45
    # dots_center =               true
    # dots_rounding =             -1
    # dots_text_format =          [[Empty]]
    outer_color =               $color5 # Color del contorno (azul cian transparente)
    inner_color =               $background # Color del interior del campo (transparente oscuro)
    font_color =                rgba(255, 255, 255, .65)
    font_family =               SF Pro Display
    font_size =                 12
    fade_on_empty =             false
    # fade_timeout =              2000
    placeholder_text =          Ingresa la contraseña...
    hide_input =                false # Si oculta los caracteres de entrada (muestra puntos)
    # hide_input_base_color =     rgba(153, 170, 187)
    rounding =                  5
    # check_color =               rgba(204, 136, 34, 1.0)
    # fail_color =                rgba(204, 34, 34, 1.0)
    # fail_text =                 <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color =            $color4
    # bothlock_color =            [[Empty]]
    # invert_numlock =            false
    # swap_font_color =           false
    position =                  0, -92
    halign =                    center
    valign =                    center
    zindex =                    0
}

# ************ DAY - MONTH - DATE ************
label {
    monitor =
    text =                      cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    # text_align =                center
    color =                     rgba(255, 255, 255, .65)
    font_size =                 12
    font_family =               SF Pro Display Bold
    # rotate =                    0
    position =                  0, -48
    halign =                    center
    valign =                    top
}

# ******************* TIME *******************
label {
    monitor =
    text =                      cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color =                     rgba(255, 255, 255, .65)
    font_size =                 48
    font_family =               SF Pro Display Bold
    position =                  0, -80
    halign =                    center
    valign =                    top
}

# ************** PASSWORD TEXT ***************
label {
    monitor =
    text =                      Password:
    color =                     rgba(255, 255, 255, .55)
    font_size =                 12
    font_family =               SF Pro Display 
    position =                  -80, -48
    halign =                    center
    valign =                    center
}

# **************** USER PHOTO ****************
image {
    monitor =
    path =                      ~/.config/hypr/user.png
    size =                      80
    rounding =                  0
    border_size =               0
    border_color =              rgba(255, 255, 255, 0)
    rotate =                    0
    reload_time =               0
    reload_cmd = 
    position =                  -80, 20
    halign =                    center
    valign =                    center
    # zindex =                    0
}

# ***************** USE NAME *****************
label {
    monitor =
    text =                      $USER
    color =                     rgba(255, 255, 255, .65)
    font_size =                 12
    font_family =               SF Pro Display
    position =                  0, 20
    halign =                    center
    valign =                    center
}

# ****************** PHRASE ******************
label {
    monitor =
    text =                      "No tengas temor a ser feliz"
    color =                     rgba(255, 255, 255, .55)
    font_size =                 12
    font_family =               SF Pro Display Italic 
    position =                  0, 20
    halign =                    center
    valign =                    button
}

